# Novoalign — rescue alignment of STAR-unmapped reads.
# NB: Novoalign is PROPRIETARY. The bioconda package installs the binary
# but a valid licence file (novoalign.lic) is required for full features.
# If licensing via conda is not possible, install Novoalign manually and
# override this env with `--conda-not-block-search-path-envvars`, or run
# the mapping stage in a container that bundles a licensed Novoalign.
name: opticlip-novoalign
channels:
  - conda-forge
  - bioconda
dependencies:
  - novoalign
