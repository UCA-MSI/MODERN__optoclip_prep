# pyicoclip / pyicos (Pyicoteo) — CLIP peak calling.
# LEGACY: Pyicoteo is Python 2 only. It is not reliably packaged on
# bioconda, so it is installed via pip inside a Python 2.7 environment.
# Pin the exact Pyicoteo version before production.
name: opticlip-pyicoclip
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=2.7
  - pip
  - pip:
      - pyicoteo
