# Slurm execution profile (Snakemake >= 8 with the slurm executor plugin).
#   pip install snakemake-executor-plugin-slurm
#   snakemake --workflow-profile profiles/slurm
executor: slurm
jobs: 50
use-conda: true
conda-frontend: mamba
printshellcmds: true
rerun-incomplete: true
software-deployment-method:
  - conda            # swap for `apptainer` to run the Singularity image
# Default resources requested per job (override per rule as needed).
default-resources:
  slurm_partition: "normal"
  runtime: 120          # minutes
  mem_mb: 8000
  cpus_per_task: 4
# Per-rule resource tuning for the heavy steps.
set-resources:
  star_index:
    mem_mb: 40000
    cpus_per_task: 8
    runtime: 240
  star_align:
    mem_mb: 40000
    cpus_per_task: 8
    runtime: 240
  novoindex:
    mem_mb: 20000
    runtime: 180
  novoalign:
    mem_mb: 16000
    cpus_per_task: 8
    runtime: 240
